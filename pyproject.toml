[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ollama-pc-agent"
version = "0.2.0"
description = "Agente local para Ollama con web, terminal, archivos y memoria persistente"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "psutil>=5.9,<8",
  "rich>=13.7,<15",
]

[project.scripts]
ollama-agent = "pc_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
